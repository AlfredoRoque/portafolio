<div class="contenedor-principal">
    <h2 mat-dialog-title>Resultado</h2>


    <mat-dialog-content>
        <div class="resultado" [innerHTML]="data"></div>
    </mat-dialog-content>


    <mat-dialog-actions align="center">
        <button mat-raised-button color="primary" mat-dialog-close>
            Cerrar
        </button>
    </mat-dialog-actions>
</div>
